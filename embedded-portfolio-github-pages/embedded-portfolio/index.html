<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>คลังผลงาน Embedded</title>
<meta name="description" content="รวมรายงานปฏิบัติการวิชา Embedded System ของ มงคล น้อยบาท">
<meta property="og:title" content="คลังผลงาน Embedded">
<meta property="og:type" content="website">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style id="app-css">

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}

:root{
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E4E7E9;
  --surface:#FAFBFB;
  --surface-2:#EDF0F1;
  --ink:#14181B;
  --ink-2:#3C4750;
  --muted:#697680;
  --line:#C6CED2;
  --line-soft:#D8DEE1;
  --accent:#0E6B76;
  --accent-soft:rgba(14,107,118,.10);
  --signal:#B5700F;
  --signal-soft:rgba(181,112,15,.12);
  --draft:#7A8489;
  --danger:#A32C22;
  --on-accent:#FFFFFF;
  --shadow:0 1px 2px rgba(20,24,27,.06),0 8px 24px rgba(20,24,27,.07);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101416;
    --surface:#191F22;
    --surface-2:#141A1D;
    --ink:#E7EDEF;
    --ink-2:#BCC7CC;
    --muted:#8D9BA2;
    --line:#2C363A;
    --line-soft:#232C30;
    --accent:#4FB5C1;
    --accent-soft:rgba(79,181,193,.14);
    --signal:#E0A24A;
    --signal-soft:rgba(224,162,74,.14);
    --draft:#7C8A91;
    --danger:#E4796C;
    --on-accent:#0B1113;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101416;
  --surface:#191F22;
  --surface-2:#141A1D;
  --ink:#E7EDEF;
  --ink-2:#BCC7CC;
  --muted:#8D9BA2;
  --line:#2C363A;
  --line-soft:#232C30;
  --accent:#4FB5C1;
  --accent-soft:rgba(79,181,193,.14);
  --signal:#E0A24A;
  --signal-soft:rgba(224,162,74,.14);
  --draft:#7C8A91;
  --danger:#E4796C;
  --on-accent:#0B1113;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"IBM Plex Sans Thai","IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.wrap{max-width:960px;margin:0 auto;padding-inline:20px;padding-block:34px 72px}

/* ---------- nameplate ---------- */
.plateHead{
  background:var(--surface);
  border:1px solid var(--line);
  border-top:3px solid var(--accent);
  box-shadow:var(--shadow);
  padding:26px 26px 22px;
}
.eyebrow{
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);margin:0 0 10px;
}
.plateHead h1{
  font-size:clamp(28px,5.2vw,40px);line-height:1.15;margin:0;
  letter-spacing:-.015em;font-weight:700;text-wrap:balance;
}
.tagline{margin:10px 0 0;color:var(--ink-2);max-width:60ch}
.idRow{
  display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:18px;padding-top:16px;
  border-top:1px solid var(--line-soft);font-size:12.5px;color:var(--muted);
}
.idRow b{color:var(--ink-2);font-weight:600}
.stats{display:flex;flex-wrap:wrap;gap:0;margin-top:18px;border:1px solid var(--line-soft);background:var(--surface-2)}
.stat{flex:1 1 120px;padding:12px 16px;border-right:1px solid var(--line-soft)}
.stat:last-child{border-right:0}
.stat .n{font-family:"IBM Plex Mono",monospace;font-size:20px;font-weight:600;line-height:1.2;display:block}
.stat .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ---------- toolbar ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:26px 0 6px}
.search{
  flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--line);padding:0 12px;height:38px;
}
.search input{
  flex:1;min-width:0;border:0;background:transparent;color:inherit;font:inherit;font-size:14px;padding:0;
}
.search input:focus{outline:none}
.search svg{flex:none;opacity:.55}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 26px}
.chip{
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.03em;
  border:1px solid var(--line);background:transparent;color:var(--ink-2);
  padding:4px 9px;border-radius:2px;cursor:pointer;line-height:1.5;
}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tag{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.04em;
  border:1px solid var(--line);color:var(--muted);padding:2px 7px;border-radius:2px;
  white-space:nowrap;
}

/* ---------- buttons ---------- */
.btn{
  font:inherit;font-size:13px;line-height:1;padding:10px 15px;border-radius:2px;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08);color:var(--on-accent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:6px 8px}
.btn.ghost:hover{color:var(--accent);background:var(--accent-soft)}
.btn.danger:hover{color:var(--danger);border-color:var(--danger);background:transparent}
.btn[disabled]{opacity:.5;cursor:default}
.btn.tiny{font-size:11.5px;padding:5px 8px}

/* ---------- rail / entries ---------- */
.rail{display:block}
.entry{display:grid;grid-template-columns:104px minmax(0,1fr);}
.plate{text-align:right;padding-right:18px;padding-top:2px}
.plate .code{
  font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;letter-spacing:.02em;
  display:block;color:var(--ink);
}
.plate .date{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);display:block;margin-top:2px}
.body{
  border-left:1px solid var(--line);padding-left:24px;padding-bottom:30px;position:relative;min-width:0;
}
.entry:last-child .body{padding-bottom:6px}
.node{
  position:absolute;left:-5px;top:7px;width:9px;height:9px;border-radius:1px;
  background:var(--accent);border:1px solid var(--accent);
}
.node.wip{background:var(--signal);border-color:var(--signal)}
.node.draft{background:var(--bg);border-color:var(--draft)}
.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px}
.head h2{margin:0;font-size:19px;font-weight:600;letter-spacing:-.01em;line-height:1.35;text-wrap:balance}
.sub{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.pill{
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 7px;border-radius:2px;border:1px solid;
}
.pill.done{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.pill.wip{color:var(--signal);border-color:var(--signal);background:var(--signal-soft)}
.pill.draft{color:var(--draft);border-color:var(--line)}
.summary{margin:10px 0 0;color:var(--ink-2);max-width:66ch}
.metaRow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px}
.rowActions{display:flex;flex-wrap:wrap;gap:2px;align-items:center;margin-top:10px}
.expandBtn{
  font:inherit;font-size:12.5px;background:none;border:0;color:var(--accent);cursor:pointer;
  padding:8px 0 0;display:inline-flex;align-items:center;gap:6px;
}
.expandBtn .car{transition:transform .18s ease;display:inline-block}
.expandBtn[aria-expanded="true"] .car{transform:rotate(90deg)}
.detail{
  margin-top:14px;background:var(--surface);border:1px solid var(--line-soft);
  padding:18px 20px;display:grid;gap:18px;
}
.detail h3{
  margin:0 0 8px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);font-weight:600;
}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:7px;counter-reset:s}
.steps li{
  display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;font-size:14px;color:var(--ink-2);
  counter-increment:s;
}
.steps li::before{
  content:counter(s,decimal-leading-zero);font-family:"IBM Plex Mono",monospace;font-size:11px;
  color:var(--accent);padding-top:3px;
}
.kv{display:flex;flex-wrap:wrap;gap:6px}
.linkList{display:grid;gap:6px;font-size:14px}
.noteBox{font-size:13.5px;color:var(--ink-2);border-left:2px solid var(--signal);padding-left:12px}

.empty{
  border:1px dashed var(--line);padding:38px 24px;text-align:center;color:var(--muted);background:var(--surface-2);
}

/* ---------- images & report file ---------- */
.lead{display:flex;gap:18px;align-items:flex-start;margin-top:10px}
.leadText{flex:1 1 300px;min-width:0}
.leadText .summary{margin-top:0}
.cover{
  flex:0 0 200px;width:200px;aspect-ratio:4/3;max-width:100%;
  border:1px solid var(--line);background:var(--surface-2);overflow:hidden;
}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.docLink{
  display:inline-flex;align-items:center;gap:8px;font-size:12.5px;text-decoration:none;
  border:1px solid var(--accent);color:var(--accent);background:var(--accent-soft);
  padding:6px 11px;border-radius:2px;
}
.docLink:hover{background:var(--accent);color:var(--on-accent)}
.docLink .fmt{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.09em}
button.docLink{font:inherit;font-size:12.5px;cursor:pointer}
dialog.docView{width:min(1020px,calc(100vw - 20px));max-height:min(92vh,1060px)}
.pdfPages{
  height:min(66vh,720px);overflow:auto;background:var(--surface-2);
  border:1px solid var(--line-soft);padding:10px;display:grid;gap:12px;align-content:start;
}
.pdfPage{width:100%;height:auto;display:block;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.pdfStatus{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.04em;color:var(--muted)}
.docHint{font-size:12.5px;color:var(--muted);margin:0}
.linkBox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.linkBox .url{
  font-family:"IBM Plex Mono",monospace;font-size:12px;background:var(--surface-2);
  border:1px solid var(--line-soft);padding:7px 9px;word-break:break-all;flex:1 1 220px;min-width:0;
}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:8px}
.gallery button{padding:0;border:1px solid var(--line-soft);background:var(--surface-2);cursor:pointer;aspect-ratio:4/3;overflow:hidden}
.gallery button:hover{border-color:var(--accent)}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
dialog.lightbox{width:min(1100px,calc(100vw - 24px))}
dialog.lightbox img{display:block;width:100%;height:auto;max-height:76vh;object-fit:contain;background:var(--surface-2)}
.imgEdit{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.imgEdit figure{margin:0;border:1px solid var(--line-soft);background:var(--surface-2)}
.imgEdit figure.isCover{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.imgEdit img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.imgEdit figcaption{display:flex;flex-wrap:wrap;gap:1px;padding:4px;justify-content:center}
@media (max-width:720px){
  .lead{flex-direction:column-reverse}
  .cover{width:100%;flex-basis:auto;aspect-ratio:16/9}
}

/* ---------- banner / toast ---------- */
.banner{
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  border:1px solid var(--signal);background:var(--signal-soft);padding:10px 14px;margin-bottom:18px;font-size:13.5px;
}
.readonly{
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;color:var(--muted);
  border:1px solid var(--line-soft);padding:4px 9px;border-radius:2px;
}
#toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--bg);padding:10px 16px;font-size:13px;border-radius:3px;
  box-shadow:var(--shadow);z-index:60;max-width:calc(100% - 32px);text-align:center;
}

/* ---------- dialog ---------- */
dialog{
  border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0;
  width:min(680px,calc(100vw - 28px));max-height:min(86vh,900px);box-shadow:var(--shadow);
}
dialog::backdrop{background:rgba(10,14,16,.55)}
.dlgHead{padding:18px 22px;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;background:var(--surface);z-index:2}
.dlgHead h2{margin:0;font-size:17px;font-weight:600}
.dlgBody{padding:20px 22px;display:grid;gap:16px;overflow:auto}
.dlgFoot{padding:14px 22px;border-top:1px solid var(--line-soft);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:0;background:var(--surface)}
.field{display:grid;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--ink-2)}
.field .hint{font-size:11.5px;color:var(--muted)}
.field input,.field textarea,.field select{
  font:inherit;font-size:14px;width:100%;padding:9px 11px;border:1px solid var(--line);
  background:var(--bg);color:var(--ink);border-radius:2px;
}
.field textarea{resize:vertical;min-height:84px;line-height:1.6}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}

footer.foot{margin-top:48px;padding-top:18px;border-top:1px solid var(--line-soft);font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between}

@media (max-width:620px){
  .wrap{padding-inline:16px;padding-block:24px 60px}
  .plateHead{padding:20px 18px 18px}
  .entry{grid-template-columns:minmax(0,1fr);gap:0}
  .plate{text-align:left;padding-right:0;display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .plate .date{margin-top:0}
  .body{border-left:0;padding-left:0;padding-bottom:26px;border-bottom:1px solid var(--line-soft);margin-bottom:22px}
  .entry:last-child .body{border-bottom:0;margin-bottom:0}
  .node{display:none}
  .detail{padding:16px}
}


/* ---------- static site additions ---------- */
.docRow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px}
a.docLink.plain{border-color:var(--line);color:var(--ink-2);background:transparent}
a.docLink.plain:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.siteNote{
  margin-top:26px;border:1px solid var(--line-soft);background:var(--surface-2);
  padding:12px 16px;font-size:12.5px;color:var(--muted);
}

</style>
</head>

      id: str(p.id) || ("p" + i), code: str(p.code), date: str(p.date),
      status: ["done","wip","draft"].indexOf(p.status) >= 0 ? p.status : "done",
      title: str(p.title), subtitle: str(p.subtitle), summary: str(p.summary),
      tags: arr(p.tags), items: arr(p.items), tools: arr(p.tools), images: arr(p.images),
      reportUrl: str(p.reportUrl).trim(), partner: str(p.partner),
      links: Array.isArray(p.links) ? p.links.filter(function(l){ return l && str(l.url); })
        .map(function(l){ return { label: str(l.label) || str(l.url), url: str(l.url) }; }) : [],
      note: str(p.note)
    };
  });

  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v == null || v === false) return;
      if (k === "text") n.textContent = v;
      else if (k === "class") n.className = v;
      else if (k.slice(0,2) === "on") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : v);
    });
    (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }

  var MONTHS = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
  function fmtDate(iso){
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
    if (!m) return iso || "";
    return Number(m[3]) + " " + MONTHS[Number(m[2]) - 1] + " " + String(Number(m[1]) + 543).slice(2);
  }
  var STATUS_LABEL = { done: "เสร็จแล้ว", wip: "กำลังทำ", draft: "ร่าง" };
  function fileKind(url){
    var m = /\.([a-z0-9]{2,5})(?:[?#].*)?$/i.exec(String(url || ""));
    return m ? m[1].toUpperCase() : "LINK";
  }

  function allTags(){
    var count = Object.create(null), seen = [];
    state.projects.forEach(function (p) {
      p.tags.forEach(function (t) { if (!count[t]) { count[t] = 0; seen.push(t); } count[t]++; });
    });
    seen.sort(function (a, b) { return count[b] - count[a]; });
    return seen;
  }
  function matches(p){
    if (filterTag && p.tags.indexOf(filterTag) < 0) return false;
    var q = query.trim().toLowerCase();
    if (!q) return true;
    return [p.code,p.title,p.subtitle,p.summary,p.note,p.tags.join(" "),p.tools.join(" "),p.items.join(" ")]
      .join(" ").toLowerCase().indexOf(q) >= 0;
  }

  function lightbox(p, start){
    var i = start;
    var dlg = el("dialog", { class: "lightbox" });
    var img = el("img", { src: p.images[i], alt: "" });
    var caption = el("span", { class: "mono" });
    function show(n){
      i = (n + p.images.length) % p.images.length;
      img.src = p.images[i];
      caption.textContent = (i + 1) + " / " + p.images.length;
    }
    dlg.appendChild(el("div", { class: "dlgHead" }, [
      el("h2", { text: p.title || p.code }),
      el("button", { class: "btn ghost", text: "✕", "aria-label": "ปิด", onclick: function(){ dlg.close(); } })
    ]));
    dlg.appendChild(img);
    dlg.appendChild(el("div", { class: "dlgFoot" }, [
      caption,
      el("button", { class: "btn", text: "◀ ก่อนหน้า", onclick: function(){ show(i - 1); } }),
      el("button", { class: "btn", text: "ถัดไป ▶", onclick: function(){ show(i + 1); } })
    ]));
    dlg.addEventListener("keydown", function (e) {
      if (e.key === "ArrowLeft") { e.preventDefault(); show(i - 1); }
      if (e.key === "ArrowRight") { e.preventDefault(); show(i + 1); }
    });
    dlg.addEventListener("close", function(){ dlg.remove(); });
    document.body.appendChild(dlg);
    show(i);
    dlg.showModal();
  }

  function render(){
    var wrap = el("div", { class: "wrap" });
    wrap.appendChild(renderHeader());
    wrap.appendChild(renderToolbar());
    wrap.appendChild(renderTagBar());
    wrap.appendChild(renderList());
    wrap.appendChild(renderFoot());
    root.replaceChildren(wrap);
  }

  function renderHeader(){
    var s = state.site;
    var missions = state.projects.reduce(function (a, p) { return a + p.items.length; }, 0);
    var techs = Object.keys(state.projects.reduce(function (a, p) {
      p.tools.forEach(function (t) { a[t] = 1; }); return a;
    }, Object.create(null))).length;
    return el("header", { class: "plateHead" }, [
      el("p", { class: "eyebrow", text: s.course || "Embedded System" }),
      el("h1", { text: s.title || "คลังผลงาน Embedded" }),
      s.tagline ? el("p", { class: "tagline", text: s.tagline }) : null,
      el("div", { class: "idRow" }, [
        s.ownerName ? el("span", {}, [el("b", { text: "ผู้จัดทำ " }),
          document.createTextNode(s.ownerName + (s.ownerId ? " · " + s.ownerId : ""))]) : null,
        s.partner ? el("span", {}, [el("b", { text: "คู่ทดลอง " }), document.createTextNode(s.partner)]) : null
      ]),
      el("div", { class: "stats" }, [
        el("div", { class: "stat" }, [el("span", { class: "n", text: String(state.projects.length) }), el("span", { class: "l", text: "ผลงาน" })]),
        el("div", { class: "stat" }, [el("span", { class: "n", text: String(missions) }), el("span", { class: "l", text: "ภารกิจ" })]),
        el("div", { class: "stat" }, [el("span", { class: "n", text: String(techs) }), el("span", { class: "l", text: "อุปกรณ์และเครื่องมือ" })])
      ])
    ]);
  }

  function renderToolbar(){
    var bar = el("div", { class: "toolbar" });
    var box = el("div", { class: "search" });
    box.appendChild(el("span", { class: "mono", text: "⌕", "aria-hidden": "true" }));
    box.appendChild(el("input", {
      id: "q", type: "search", value: query, placeholder: "ค้นหาผลงาน ภารกิจ หรืออุปกรณ์",
      "aria-label": "ค้นหาผลงาน",
      oninput: function (e) {
        query = e.target.value;
        var host = document.getElementById("railHost");
        if (host) host.replaceWith(renderList());
      }
    }));
    bar.appendChild(box);
    return bar;
  }

  function renderTagBar(){
    var tags = allTags();
    var host = el("div", { class: "chips" });
    if (!tags.length) return host;
    host.appendChild(el("button", { class: "chip", "aria-pressed": filterTag ? "false" : "true",
      text: "ทั้งหมด", onclick: function(){ filterTag = null; render(); } }));
    var LIMIT = 12;
    var visible = (showAllTags || tags.length <= LIMIT + 2) ? tags : tags.slice(0, LIMIT);
    if (filterTag && visible.indexOf(filterTag) < 0) visible = visible.concat([filterTag]);
    visible.forEach(function (t) {
      host.appendChild(el("button", { class: "chip", "aria-pressed": filterTag === t ? "true" : "false",
        text: t, onclick: function(){ filterTag = (filterTag === t ? null : t); render(); } }));
    });
    if (visible.length < tags.length) {
      host.appendChild(el("button", { class: "chip", text: "+ อีก " + (tags.length - visible.length) + " หมวด",
        onclick: function(){ showAllTags = true; render(); } }));
    } else if (showAllTags && tags.length > LIMIT + 2) {
      host.appendChild(el("button", { class: "chip", text: "ย่อหมวด",
        onclick: function(){ showAllTags = false; render(); } }));
    }
    return host;
  }

  function renderList(){
    var host = el("div", { id: "railHost" });
    var shown = state.projects.filter(matches);
    if (!shown.length) {
      host.appendChild(el("div", { class: "empty", text: "ไม่พบผลงานที่ตรงกับที่ค้นหา" }));
      return host;
    }
    var rail = el("div", { class: "rail" });
    shown.forEach(function (p) { rail.appendChild(renderEntry(p)); });
    host.appendChild(rail);
    return host;
  }

  function renderEntry(p){
    var open = !!openIds[p.id];
    var plate = el("div", { class: "plate" }, [
      el("span", { class: "code", text: p.code || "—" }),
      el("span", { class: "date", text: p.date ? fmtDate(p.date) : "ยังไม่ระบุวันที่" })
    ]);
    var body = el("div", { class: "body" }, [
      el("span", { class: "node " + p.status, "aria-hidden": "true" }),
      el("div", { class: "head" }, [
        el("h2", { text: p.title || "(ยังไม่มีชื่อผลงาน)" }),
        el("span", { class: "pill " + p.status, text: STATUS_LABEL[p.status] })
      ]),
      p.subtitle ? el("p", { class: "sub", text: p.subtitle }) : null
    ]);

    var textCol = el("div", { class: "leadText" });
    if (p.summary) textCol.appendChild(el("p", { class: "summary", text: p.summary }));
    if (p.tags.length) {
      var meta = el("div", { class: "metaRow" });
      p.tags.forEach(function (t) { meta.appendChild(el("span", { class: "tag", text: t })); });
      textCol.appendChild(meta);
    }
    if (p.reportUrl) {
      var name = (p.code ? p.code + " - " : "") + (p.title || "report") + ".pdf";
      textCol.appendChild(el("div", { class: "docRow" }, [
        el("a", { class: "docLink", href: p.reportUrl, target: "_blank", rel: "noopener" }, [
          el("span", { class: "fmt", text: fileKind(p.reportUrl) }),
          el("span", { text: "เปิดอ่านรายงานฉบับเต็ม" })
        ]),
        el("a", { class: "docLink plain", href: p.reportUrl, download: name, text: "ดาวน์โหลด" })
      ]));
    }
    var lead = el("div", { class: "lead" }, [textCol]);
    if (p.images.length) {
      lead.appendChild(el("div", { class: "cover" }, [
        el("img", { src: p.images[0], alt: "ภาพจากผลงาน " + (p.title || p.code), loading: "lazy" })
      ]));
    }
    body.appendChild(lead);

    if (p.items.length || p.tools.length || p.links.length || p.images.length || p.note || p.partner) {
      body.appendChild(el("button", {
        class: "expandBtn", "aria-expanded": open ? "true" : "false",
        onclick: function(){ openIds[p.id] = !openIds[p.id]; render(); }
      }, [
        el("span", { class: "car", text: "▸", "aria-hidden": "true" }),
        el("span", { text: open ? "ย่อรายละเอียด" : "ดูรายละเอียด · " + p.items.length + " ภารกิจ" })
      ]));
      if (open) body.appendChild(renderDetail(p));
    }
    return el("article", { class: "entry" }, [plate, body]);
  }

  function renderDetail(p){
    var d = el("div", { class: "detail" });
    if (p.items.length) {
      var ol = el("ol", { class: "steps" });
      p.items.forEach(function (t) { ol.appendChild(el("li", { text: t })); });
      d.appendChild(el("section", {}, [el("h3", { text: "ภารกิจและการทดลอง" }), ol]));
    }
    if (p.images.length) {
      var g = el("div", { class: "gallery" });
      p.images.forEach(function (src, i) {
        g.appendChild(el("button", { type: "button",
          "aria-label": "ดูภาพที่ " + (i + 1) + " ของ " + (p.title || p.code),
          onclick: function(){ lightbox(p, i); } }, [el("img", { src: src, alt: "", loading: "lazy" })]));
      });
      d.appendChild(el("section", {}, [el("h3", { text: "ภาพจากการทดลอง" }), g]));
    }
    if (p.tools.length) {
      var kv = el("div", { class: "kv" });
      p.tools.forEach(function (t) { kv.appendChild(el("span", { class: "tag", text: t })); });
      d.appendChild(el("section", {}, [el("h3", { text: "อุปกรณ์และเครื่องมือ" }), kv]));
    }
    if (p.links.length) {
      var ll = el("div", { class: "linkList" });
      p.links.forEach(function (l) {
        ll.appendChild(el("a", { href: l.url, target: "_blank", rel: "noopener noreferrer", text: l.label }));
      });
      d.appendChild(el("section", {}, [el("h3", { text: "ลิงก์ที่เกี่ยวข้อง" }), ll]));
    }
    if (p.partner) d.appendChild(el("section", {}, [el("h3", { text: "คู่ทดลอง" }), el("p", { class: "sub", text: p.partner })]));
    if (p.note) d.appendChild(el("section", {}, [el("h3", { text: "หมายเหตุ" }), el("p", { class: "noteBox", text: p.note })]));
    return d;
  }

  function renderFoot(){
    var s = state.site;
    return el("footer", { class: "foot" }, [
      el("span", { text: (s.ownerName || "") + (s.ownerId ? " · " + s.ownerId : "") }),
      el("span", { class: "mono", text: state.projects.length + " works" })
    ]);
  }

  render();
})();
</script>
</body>
</html>
